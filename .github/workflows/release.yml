name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # CPU variants (x64 + ARM64). Produces signed installers + updater
  # artifacts (latest.json + .sig files). The Tauri updater in the
  # installed app points to this job's latest.json.
  #
  # gpu-detect is disabled on ARM64 (--no-default-features) because
  # NVIDIA does not ship nvml.dll for Windows ARM64. All other features
  # (whisper.cpp, llama.cpp, ONNX Runtime, WASAPI audio, etc.) compile
  # natively for both architectures.
  cpu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            cargo-args: ""
          - arch: arm64
            runner: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            cargo-args: "-- --no-default-features"

    name: cpu (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: cpu-${{ matrix.arch }}

      - name: Install npm dependencies
        run: npm ci

      - name: Enable updater artifacts
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.createUpdaterArtifacts = $true
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

      - name: Setup MSVC ARM64 developer environment
        if: matrix.arch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Use Clang for ARM64 native C/C++ (ggml requirement)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          echo "CC=clang-cl" >> $env:GITHUB_ENV
          echo "CXX=clang-cl" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          echo "CFLAGS=--target=aarch64-pc-windows-msvc" >> $env:GITHUB_ENV
          echo "CXXFLAGS=--target=aarch64-pc-windows-msvc /EHsc" >> $env:GITHUB_ENV

      - name: Build + sign + bundle (CPU ${{ matrix.arch }})
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Parla ${{ github.ref_name }}"
          releaseBody: |
            See the [changelog](https://github.com/LitteRabbit-37/Parla/blob/main/CHANGELOG.md) for details.

            This release ships CPU variants for both x64 and ARM64:
            - `Parla_x.y.z_x64-setup.exe` — for standard x86-64 Windows PCs
            - `Parla_x.y.z_arm64-setup.exe` — for Windows on ARM devices (Snapdragon, etc.)

            Both variants run Whisper, Parakeet and llama.cpp on CPU and work on every Windows 10 / 11 machine of their respective architecture. Auto-updater is wired via `latest.json` so future releases install themselves.

            A third installer, `Parla_x.y.z_x64-directml-setup.exe`, runs Parakeet on any DirectX 12 GPU (AMD, Intel, NVIDIA) through ONNX Runtime DirectML and falls back to CPU if the GPU cannot be used. Whisper and the local LLM stay on CPU in that variant. It does not update itself: download the same variant again for new releases.

            Users with an NVIDIA GPU who want CUDA acceleration can build Parla themselves from source - see [BUILDING.md](https://github.com/LitteRabbit-37/Parla/blob/main/BUILDING.md#cuda-build) for the recipe.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust-target }} ${{ matrix.cargo-args }}

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: parla-${{ matrix.arch }}-installer
          path: src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/
          if-no-files-found: error

  # DirectML variant (x64 only, issue #9). The pyke ONNX Runtime binaries
  # that ort downloads are always compiled with DirectML on Windows (ort-sys
  # build/static_link links DirectML / D3D12 in every Windows build), so this
  # job costs no extra native compilation : the `directml-onnx` feature only
  # makes Parakeet request the DirectML execution provider (CPU fallback
  # built in). No updater artifacts : latest.json keeps pointing to the CPU
  # installer and the app sends GPU builds to the release page instead.
  # Runs after `cpu` so the draft release exists, then attaches the renamed
  # installer to it.
  directml:
    needs: cpu
    name: directml (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: directml-x64

      - name: Install npm dependencies
        run: npm ci

      - name: Build (DirectML x64)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --features directml-onnx

      - name: Rename installer
        id: rename
        shell: pwsh
        run: |
          $src = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_x64-setup.exe | Select-Object -First 1
          if (-not $src) { throw "DirectML installer not found" }
          $name = $src.Name -replace '_x64-setup\.exe$', '_x64-directml-setup.exe'
          $dst = Join-Path $src.DirectoryName $name
          Move-Item $src.FullName $dst -Force
          "path=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.rename.outputs.path }}" --clobber --repo "${{ github.repository }}"

      - name: Upload DirectML artifact
        uses: actions/upload-artifact@v4
        with:
          name: parla-x64-directml-installer
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error

  # NOTE : GitHub's public windows-latest runner (4 cores, 16 GB, 14 GB
  # disk) is too small to compile whisper.cpp CUDA + llama.cpp CUDA +
  # ggml-cuda within the 6h job limit - nvcc + MSBuild oversubscribe the
  # machine and swap-thrash until the job dies. We ship CPU only from
  # CI and users who want CUDA build from source on their own GPU box
  # (cf BUILDING.md section "CUDA build"). If you ever add a self-hosted
  # runner or bump to GitHub Team's larger runners, the recipe to add
  # back a cuda job is in the git history (tag v0.1.0 initial attempt).
